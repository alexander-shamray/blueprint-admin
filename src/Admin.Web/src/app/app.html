<header class="bar">
  <strong>blueprint-admin</strong>
  <nav>
    @for (screen of screens; track screen.path) {
      <a [routerLink]="'/' + screen.path" routerLinkActive="active">{{ screen.label }}</a>
    }
  </nav>
  <span class="palette-key"><kbd>Ctrl</kbd>+<kbd>K</kbd> commands</span>
  @if (config(); as c) {
    <span class="hint">{{ c.backendDir }} @if (c.fakePlatform) {<em>(fake platform)</em>}</span>
  }
</header>
<main><router-outlet /></main>
<app-command-palette />
