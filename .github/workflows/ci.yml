name: ci

on:
  push:
    branches: [main]
  pull_request:

# The host restores the assistant's core from blueprint-backend's packages on
# GitHub Packages (nuget.config), which asks for a token even for a public
# package. The job's own token reads them, because both packages grant this
# repository Read under Manage Actions access; no secret is stored. It is
# handed, as GITHUB_PACKAGES_TOKEN, only to the steps that restore.
permissions:
  contents: read
  packages: read

jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      # ProcessRunnerTests spawn node; it is the one long-running command that
      # behaves the same on both runners.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # The pin gate (.github/pin-gate/README.md): no project file chooses
      # a version or a feed. A required check, so it holds the merge; the
      # restores beside it already run the PR's own code. One leg, since the
      # tree is the same on both.
      - if: runner.os == 'Linux'
        run: python3 .github/pin-gate/pin_gate.py
      # Its evaluation (the same README): each project as MSBuild evaluates
      # it, before this job's build restores. On both legs, since a
      # condition can key an import on the operating system.
      - run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} .github/pin-gate/evaluate.py
      - run: dotnet build --configuration Release
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: dotnet test --configuration Release --no-build

  # The owner-drift gate: the facts this console copies, read against the
  # backend's main. The host job skips these tests because no clone sits
  # beside it; ADMIN_DRIFT_REQUIRED makes a missing clone a failure here, so
  # this job cannot pass by not finding what it checked out.
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: alexander-shamray/blueprint-backend
          path: .drift/blueprint-backend
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet test tests/Admin.Host.Tests --filter-namespace "Admin.Host.Tests.Drift"
        env:
          BLUEPRINT_Admin__BackendDir: ${{ github.workspace }}/.drift/blueprint-backend
          ADMIN_DRIFT_REQUIRED: 'true'
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Admin.Web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/Admin.Web/package-lock.json
      - run: npm ci
      # High and critical only, dev dependencies included: the same toolchain runs on a developer's machine beside the
      # realm passwords, and this is where an advisory in it is caught. Dependabot security updates (a repository
      # setting, #398) open the fix; docs/testing.md says what to do when there is none.
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run build

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/Admin.Web/package-lock.json
      - run: dotnet build
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm ci
        working-directory: src/Admin.Web
      - run: npm run build
        working-directory: src/Admin.Web
      - run: npx playwright install --with-deps chromium
        working-directory: src/Admin.Web
      - run: npm run e2e
        working-directory: src/Admin.Web
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: src/Admin.Web/playwright-report/

  # A pull request lands by rebase, so `host`, `web` and `smoke` have only ever
  # seen the head. Each commit before the head is built here, so `git bisect`
  # meets only commits that compile: on the pull request, and again on the push
  # to `main`, where the landing has replayed them onto a `main` the pull request
  # was never tested against. A red test in one costs a single step, so tests
  # are not run; a range of one commit has nothing to build and passes. The SPA
  # is built only for a commit that touches it, after one `npm ci` per lockfile.
  # Each commit passes the pin gate before it is built, since a later bisect
  # restores it on a developer's machine; the head's copy judges, as in the
  # host job. It judges each commit against the branch's fork point, not
  # against a clean slate: a refusal the fork point already carries is a rule
  # `main` gained after the branch forked (#563), which no commit of the branch
  # can satisfy and a bisect meets on `main` too, so only a refusal a commit
  # adds stops it. An exit above 1, or a 1 that names no refusal (an uncaught
  # exception's traceback goes to stderr), is the gate not running, and stops
  # it there.
  commits:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Every commit before the head builds
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.after }}
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t shas < <(git rev-list --reverse "$BASE_SHA..$HEAD_SHA" | grep -vx "$HEAD_SHA" || true)
          echo "${#shas[@]} commit(s) besides the head"
          installed=""
          cp .github/pin-gate/pin_gate.py "$RUNNER_TEMP/pin_gate.py"
          cp .github/pin-gate/evaluate.py "$RUNNER_TEMP/evaluate.py"
          refusals() {
            local status=0
            python3 "$RUNNER_TEMP/pin_gate.py" > "$RUNNER_TEMP/gate.out" || status=$?
            if [ "$status" -gt 1 ] || { [ "$status" -eq 1 ] && ! grep -q '^::error::' "$RUNNER_TEMP/gate.out"; }; then
              cat "$RUNNER_TEMP/gate.out" >&2; return 2
            fi
            grep '^::error::' "$RUNNER_TEMP/gate.out" | LC_ALL=C sort || true
          }
          git checkout --quiet --detach "$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          inherited=$(refusals)
          if [ -n "$inherited" ]; then
            echo "the fork point already carries these refusals, so no commit is held to them:"
            printf '%s\n' "$inherited" | sed 's/^::error::/  /'
          fi
          for sha in "${shas[@]}"; do
            echo "::group::$sha"
            git checkout --quiet --detach "$sha"
            git clean -fdxq -e src/Admin.Web/node_modules
            found=$(refusals)
            added=$(LC_ALL=C comm -13 <(printf '%s\n' "$inherited") <(printf '%s\n' "$found"))
            if [ -n "$added" ]; then printf '%s\n' "$added"; exit 1; fi
            python3 "$RUNNER_TEMP/evaluate.py"
            dotnet build BlueprintAdmin.slnx --configuration Release
            if git diff --quiet "$sha^" "$sha" -- src/Admin.Web; then
              echo "no SPA change: not built"
            else
              lock=$(git hash-object src/Admin.Web/package-lock.json)
              if [ "$lock" != "$installed" ]; then
                (cd src/Admin.Web && npm ci)
                installed="$lock"
              fi
              (cd src/Admin.Web && npm run build)
            fi
            echo "::endgroup::"
          done

  # The harness's own suite. Python 3.12 matches the PreToolUse hooks.
  # The matrix is the module's own claim: link resolution, case folding and
  # which primitives exist differ by platform.
  harness:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - if: runner.os == 'Windows'
        run: choco install jq --no-progress -y
      - if: runner.os == 'macOS'
        run: brew install jq
      - name: The suite reads `git ls-files`, so the checkout must be a real one
        run: git rev-parse --is-inside-work-tree
      # Every root, as parallel class shards: the serial run cost 440 s on
      # this matrix's Windows leg against 107 s on ubuntu. The runner owns
      # which roots those are, so this job and harness-checks.sh cannot come
      # to run different suites. Its roots include .github/locality-gate and
      # tools/token-usage (#144). The gate's own workflow is a different
      # subject — the base copy of the gate judged against the PR body —
      # rather than a duplicate of this.
      - run: python .claude/scripts/shard-harness-suite.py
