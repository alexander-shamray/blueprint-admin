name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      # ProcessRunnerTests spawn node; it is the one long-running command that
      # behaves the same on both runners.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: dotnet build --configuration Release
      - run: dotnet test --configuration Release --no-build

  # The owner-drift gate: the facts this console copies, read against the
  # backend's main. The host job skips these tests because no clone sits
  # beside it; ADMIN_DRIFT_REQUIRED makes a missing clone a failure here, so
  # this job cannot pass by not finding what it checked out.
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: alexander-shamray/blueprint-backend
          path: .drift/blueprint-backend
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet test tests/Admin.Host.Tests --filter-namespace "Admin.Host.Tests.Drift"
        env:
          BLUEPRINT_Admin__BackendDir: ${{ github.workspace }}/.drift/blueprint-backend
          ADMIN_DRIFT_REQUIRED: 'true'

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Admin.Web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/Admin.Web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/Admin.Web/package-lock.json
      - run: dotnet build
      - run: npm ci
        working-directory: src/Admin.Web
      - run: npm run build
        working-directory: src/Admin.Web
      - run: npx playwright install --with-deps chromium
        working-directory: src/Admin.Web
      - run: npm run e2e
        working-directory: src/Admin.Web
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: src/Admin.Web/playwright-report/

  # A pull request lands by rebase, so every commit reaches `main` as pushed and
  # `host`, `web` and `smoke` have only ever seen the head. Each commit before
  # the head is built here, so `git bisect` meets only commits that compile. A
  # red test in one costs a single step, so tests are not run; a pull request of
  # one commit has nothing to build and passes. The SPA is built only for a
  # commit that touches it, after one `npm ci` per lockfile.
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Every commit before the head builds
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mapfile -t shas < <(git rev-list --reverse "$BASE_SHA..$HEAD_SHA" | grep -vx "$HEAD_SHA" || true)
          echo "${#shas[@]} commit(s) besides the head"
          installed=""
          for sha in "${shas[@]}"; do
            echo "::group::$sha"
            git checkout --quiet --detach "$sha"
            git clean -fdxq -e src/Admin.Web/node_modules
            dotnet build BlueprintAdmin.slnx --configuration Release
            if git diff --quiet "$sha^" "$sha" -- src/Admin.Web; then
              echo "no SPA change: not built"
            else
              lock=$(git hash-object src/Admin.Web/package-lock.json)
              if [ "$lock" != "$installed" ]; then
                (cd src/Admin.Web && npm ci)
                installed="$lock"
              fi
              (cd src/Admin.Web && npm run build)
            fi
            echo "::endgroup::"
          done

  # The harness's own suite. Python 3.12 matches the PreToolUse hooks.
  # The matrix is the module's own claim: link resolution, case folding and
  # which primitives exist differ by platform.
  harness:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - if: runner.os == 'Windows'
        run: choco install jq --no-progress -y
      - if: runner.os == 'macOS'
        run: brew install jq
      - name: The suite reads `git ls-files`, so the checkout must be a real one
        run: git rev-parse --is-inside-work-tree
      # Every root, as parallel class shards: the serial run cost 440 s on
      # this matrix's Windows leg against 107 s on ubuntu. The runner owns
      # which roots those are, so this job and harness-checks.sh cannot come
      # to run different suites. Its roots include .github/locality-gate and
      # tools/token-usage (#144). The gate's own workflow is a different
      # subject — the base copy of the gate judged against the PR body —
      # rather than a duplicate of this.
      - run: python .claude/scripts/shard-harness-suite.py
