name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      # ProcessRunnerTests spawn node; it is the one long-running command that
      # behaves the same on both runners.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: dotnet build --configuration Release
      - run: dotnet test --configuration Release --no-build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Admin.Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/Admin.Web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/Admin.Web/package-lock.json
      - run: dotnet build
      - run: npm ci
        working-directory: src/Admin.Web
      - run: npm run build
        working-directory: src/Admin.Web
      - run: npx playwright install --with-deps chromium
        working-directory: src/Admin.Web
      - run: npm run e2e
        working-directory: src/Admin.Web
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: src/Admin.Web/playwright-report/
