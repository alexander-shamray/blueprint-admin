name: ci

on:
  push:
    branches: [main]
  pull_request:

# The host restores the assistant's core from blueprint-backend's packages on
# GitHub Packages (nuget.config), which asks for a token even for a public
# package. The job's own token reads them, because both packages grant this
# repository Read under Manage Actions access; no secret is stored. It is
# handed, as GITHUB_PACKAGES_TOKEN, only to the steps that restore.
permissions:
  contents: read
  packages: read

# A newer push to a pull request cancels the run of the head it superseded. On
# `main` each commit has a group of its own and nothing is cancelled, so every
# landing is built and `main-red.yml` sees its conclusion. A rerun has a group
# of its own too, so rerunning a stale head cannot cancel a newer head's
# required checks. blueprint-harness's `ci.yml` holds the same group.
concurrency:
  group: >-
    ci-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}${{
    github.run_attempt != '1' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      # ProcessRunnerTests spawn node; it is the one long-running command that
      # behaves the same on both runners.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # The pin gate (.github/pin-gate/README.md): no project file chooses
      # a version or a feed. A required check, so it holds the merge; the
      # restores beside it already run the PR's own code. One leg, since the
      # tree is the same on both.
      - if: runner.os == 'Linux'
        run: python3 .github/pin-gate/pin_gate.py
      # Its judge of the build (the same README): what each build below
      # imported and restored, read from its binary log, so restore's and the
      # solution's global properties, the step's environment and restore's
      # own output are the build's own (#566). Debug, as `smoke` and a
      # developer build it, and Release, on both legs, since a condition can
      # key an import on the configuration or the operating system. Each log
      # is judged before the next build restores: both configurations share
      # one project.assets.json, which the judge reads beside its log.
      - run: dotnet build -bl:${{ runner.temp }}/debug.binlog
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} .github/pin-gate/judge_build.py ${{ runner.temp }}/debug.binlog
      - run: dotnet build --configuration Release -bl:${{ runner.temp }}/release.binlog
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} .github/pin-gate/judge_build.py ${{ runner.temp }}/release.binlog
      # The output gate (.github/output-gate/README.md): no bin/ or obj/ beside
      # the source, and every project restored and built into artifacts/. It
      # reads what the builds above left, so it runs behind both and before the
      # tests, on both legs, since each runner's build is its own.
      - name: No build output landed beside the source
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} .github/output-gate/output_gate.py
      # The TRX keeps each test's duration after the log is gone; under
      # artifacts/, which is ignored and which the output gate reads only by
      # its bin/ and obj/. Uploaded on a failure too, where it is wanted most.
      - run: dotnet test --configuration Release --no-build --report-xunit-trx --results-directory artifacts/test-results
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: host-trx-${{ matrix.os }}
          path: artifacts/test-results/*.trx
          retention-days: 7

  # The owner-drift gate: the facts this console copies, read against the
  # backend commit .github/drift/backend.sha pins, which drift-pin.yml keeps
  # level with the backend's main. The host job skips these tests because no
  # clone sits beside it; ADMIN_DRIFT_REQUIRED makes a missing clone a failure
  # here, so this job cannot pass by not finding what it checked out.
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # An empty ref would check out the backend's default branch, so anything
      # but one whole commit id fails here rather than reading main unasked.
      - id: pin
        run: |
          sha=$(tr -d '[:space:]' < .github/drift/backend.sha)
          if ! printf '%s' "$sha" | grep -Eqx '[0-9a-f]{40}'; then
            echo "::error file=.github/drift/backend.sha::not one 40-hex commit id: '$sha'"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: alexander-shamray/blueprint-backend
          ref: ${{ steps.pin.outputs.sha }}
          path: .drift/blueprint-backend
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet test tests/Admin.Host.Tests --filter-namespace "Admin.Host.Tests.Drift"
        env:
          BLUEPRINT_Admin__BackendDir: ${{ github.workspace }}/.drift/blueprint-backend
          ADMIN_DRIFT_REQUIRED: 'true'
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Admin.Web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/Admin.Web/package-lock.json
      - run: npm ci
      # High and critical only, dev dependencies included: the same toolchain runs on a developer's machine beside the
      # realm passwords, and this is where an advisory in it is caught. Dependabot security updates (a repository
      # setting, #398) open the fix; docs/testing.md says what to do when there is none.
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run build

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/Admin.Web/package-lock.json
      - run: dotnet build
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm ci
        working-directory: src/Admin.Web
      - run: npm run build
        working-directory: src/Admin.Web
      # `--with-deps` installs Playwright's system packages from the live Ubuntu mirrors: retries
      # make a blip cheap, and the step's own bound makes an outage fail before the job's does.
      - run: echo 'Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/80-retries
      - run: npx playwright install --with-deps chromium
        timeout-minutes: 8
        working-directory: src/Admin.Web
      - run: npm run e2e
        working-directory: src/Admin.Web
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: src/Admin.Web/playwright-report/

  # A pull request lands by rebase, so `host`, `web` and `smoke` have only ever
  # seen the head. Each commit before the head is built here, so `git bisect`
  # meets only commits that compile: on the pull request, and again on the push
  # to `main`, where the landing has replayed them onto a `main` the pull request
  # was never tested against. A red test in one costs a single step, so tests
  # are not run; a range of one commit has nothing to build and passes. The SPA
  # is built only for a commit that touches it, after one `npm ci` per lockfile.
  # Each commit passes the pin gate before it is built, since a later bisect
  # restores it on a developer's machine; the head's copy judges, as in the
  # host job. It judges each commit against the branch's fork point, not
  # against a clean slate: a refusal the fork point already carries is a rule
  # the judging copy holds and the fork point's tree predates, most often one
  # `main` gained after the branch forked (#563). No commit of the branch can
  # satisfy it and a bisect meets it on `main` too, so only a refusal a commit
  # adds stops it. An exit above 1, or a 1 that names no refusal (an uncaught
  # exception's traceback goes to stderr), is the gate not running, and stops
  # it there. The build's judge reads each commit's
  # log after its build, and its refusals are held to the fork point's the
  # same way, so the fork point is built once too. At the fork point alone, a
  # gate that does not run (its SDK pin older than the head's, under
  # `rollForward: disable`), or a build that fails, forgives nothing: every
  # commit is held to that gate's every refusal, and the other gate's
  # inherited refusals still count.
  commits:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Every commit before the head builds
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.after }}
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t shas < <(git rev-list --reverse "$BASE_SHA..$HEAD_SHA" | grep -vx "$HEAD_SHA" || true)
          echo "${#shas[@]} commit(s) besides the head"
          installed=""
          cp .github/pin-gate/pin_gate.py "$RUNNER_TEMP/pin_gate.py"
          cp .github/pin-gate/judge_build.py "$RUNNER_TEMP/judge_build.py"
          # One gate's refusals, sorted; 2, with its output, when it did not run.
          refusals() {
            local status=0
            python3 "$RUNNER_TEMP/$1" "${@:2}" > "$RUNNER_TEMP/gate.out" || status=$?
            if [ "$status" -gt 1 ] || { [ "$status" -eq 1 ] && ! grep -q '^::error::' "$RUNNER_TEMP/gate.out"; }; then
              cat "$RUNNER_TEMP/gate.out" >&2
              return 2
            fi
            { grep '^::error::' "$RUNNER_TEMP/gate.out" || true; } | LC_ALL=C sort
          }
          build() { dotnet build BlueprintAdmin.slnx --configuration Release -bl:"$RUNNER_TEMP/build.binlog"; }
          # A refusal the commit adds to its fork point's stops it.
          held() {
            local added
            added=$(LC_ALL=C comm -13 <(printf '%s\n' "$inherited") <(printf '%s\n' "$1"))
            if [ -n "$added" ]; then printf '%s\n' "$added"; exit 1; fi
          }
          inherited=""
          if [ "${#shas[@]}" -gt 0 ]; then
            git checkout --quiet --detach "$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
            static="" built=""
            static=$(refusals pin_gate.py) ||
              echo "::warning::pin_gate.py does not run at the fork point, so every commit is held to its every refusal"
            if build >&2; then
              built=$(refusals judge_build.py "$RUNNER_TEMP/build.binlog") ||
                echo "::warning::judge_build.py does not run at the fork point, so every commit is held to its every refusal"
            else
              echo "::warning::the fork point does not build, so every commit is held to its build's every refusal"
            fi
            inherited=$(printf '%s\n%s\n' "$static" "$built" | sed '/^$/d' | LC_ALL=C sort)
          fi
          if [ -n "$inherited" ]; then
            echo "the fork point already carries these refusals, so no commit is held to them:"
            printf '%s\n' "$inherited" | sed 's/^::error::/  /'
          fi
          for sha in "${shas[@]}"; do
            echo "::group::$sha"
            git checkout --quiet --detach "$sha"
            git clean -fdxq -e src/Admin.Web/node_modules
            found=$(refusals pin_gate.py)
            held "$found"
            build
            found=$(refusals judge_build.py "$RUNNER_TEMP/build.binlog")
            held "$found"
            if git diff --quiet "$sha^" "$sha" -- src/Admin.Web; then
              echo "no SPA change: not built"
            else
              lock=$(git hash-object src/Admin.Web/package-lock.json)
              if [ "$lock" != "$installed" ]; then
                (cd src/Admin.Web && npm ci)
                installed="$lock"
              fi
              (cd src/Admin.Web && npm run build)
            fi
            echo "::endgroup::"
          done

  # The harness's own suite. Python 3.12 matches the PreToolUse hooks.
  # The matrix is the module's own claim: link resolution, case folding and
  # which primitives exist differ by platform.
  harness:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # The issue-form gate below lists the repository's labels; nothing in
    # this job restores a package, so the workflow's packages grant is not
    # carried over.
    permissions:
      contents: read
      issues: read
    steps:
      # Depth 2 keeps the merge commit's parents, which the decision below
      # compares.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # harness-legs.py owns the rule and what reaches these legs
      # (docs/harness-boundaries.md, *The harness legs decision*). A pull
      # request that reaches none of it still reports each leg, with the
      # payload's suite skipped; Linux, a push and this repository's own
      # suites always run.
      - name: Decide whether this leg tests
        id: reach
        if: runner.os != 'Linux'
        shell: bash
        run: python .claude/scripts/harness-legs.py >> "$GITHUB_OUTPUT"
      - if: runner.os == 'Windows'
        run: choco install jq --no-progress -y
      - if: runner.os == 'macOS'
        run: brew install jq
      - name: The suite reads `git ls-files`, so the checkout must be a real one
        run: git rev-parse --is-inside-work-tree
      # The payload's suite whole: the shard runner on Linux and macOS, the
      # shape the harness's own `payload-suites` job certifies, and serially on
      # Windows, where parallel workers fail cases that fork or time under
      # load. Git's bash on Windows, so one script serves all three.
      - name: The payload's suite
        if: runner.os == 'Linux' || steps.reach.outputs.test != 'false'
        shell: bash
        run: |
          bash --version | head -n 1
          if [ "$RUNNER_OS" = Windows ]; then
            python -m unittest discover -s .claude/scripts -v
          else
            python .claude/scripts/shard-harness-suite.py
          fi
      # The roots that runner does not know, as harness-checks.sh runs them;
      # test_harness_helpers_admin.py holds the two lists together. A gate's own
      # workflow is a different subject, the base copy of the gate judged against
      # the PR body, rather than a duplicate of this.
      - name: This repository's own suites
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s .github/locality-gate -p 'test*.py'
          python -m unittest discover -s .github/commit-gate -p 'test*.py'
          python -m unittest discover -s .github/pin-gate -p 'test*.py'
          python -m unittest discover -s .github/issue-form-gate -p 'test*.py'
          python -m unittest discover -s tools/token-usage -p 'test_*.py'
      # The issue form against the helper's vocabularies and the labels its
      # answers name (.github/issue-form-gate/README.md); its suite ran in
      # the step above. One leg, since the labels are the repository's and
      # not the runner's, and the one input this job reads over the network.
      - if: runner.os == 'Linux'
        name: Every issue-form choice is its owner's word and a label here
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          gh label list --repo "$GITHUB_REPOSITORY" --limit 1000 --json name |
            python .github/issue-form-gate/issue_form_gate.py

  # Every gate suite under .github/, in the shape of the harness's `payload-suites`
  # gate step, on a push to main too: a gate's own workflow runs its suite on a
  # pull request alone, and one neither a workflow nor `harness` names runs nowhere.
  # The loop finds the directories, so a suite a sync adds needs no line here, and
  # finding none fails. Being in this workflow puts it in the set main-red.yml watches.
  gate-suites:
    runs-on: ubuntu-latest
    # Bounds a step that never exits. Headroom over the usual run, not a duration.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test the gates
        run: |
          set -uo pipefail
          ran=0 failed=0
          for dir in .github/*/; do
            compgen -G "${dir}test_*.py" > /dev/null || continue
            echo "::group::${dir%/}"
            (cd "$dir" && python -m unittest) || failed=1
            echo "::endgroup::"
            ran=$((ran + 1))
          done
          if [ "$ran" -eq 0 ]; then echo "no gate suite found under .github/" >&2; exit 1; fi
          exit "$failed"
      - name: Every plan written after the planning rule is under its size
        run: python .github/plan-size-gate/plan_size_gate.py

  # actionlint reads what the text gates do not: expression syntax, step-output
  # references, action input names and, through the runner's shellcheck, the
  # shell in a `run:` block; .github/workflow-lint/README.md owns the claim. The
  # binary is pinned by version and checked against its release's published
  # digest, so the download is the one that was read.
  workflow-lint:
    runs-on: ubuntu-latest
    # Bounds a step that never exits. Headroom over the usual run, not a duration.
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -sSfL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf actionlint.tar.gz actionlint
      # A lint that passes every workflow says nothing until it has been seen
      # to fail one. The fixture reads a step that does not exist, and the
      # message is matched so a failure for another reason does not count.
      - name: The linter fails a broken reference
        run: |
          if ./actionlint .github/workflow-lint/broken-reference.yml > fixture.out; then
            echo "actionlint passed the broken fixture"
            exit 1
          fi
          grep -F 'property "absent" is not defined' fixture.out
      - name: Lint every workflow
        run: ./actionlint
