name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      # ProcessRunnerTests spawn node; it is the one long-running command that
      # behaves the same on both runners.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: dotnet build --configuration Release
      - run: dotnet test --configuration Release --no-build

  # The owner-drift gate: the facts this console copies, read against the
  # backend's main. The host job skips these tests because no clone sits
  # beside it; ADMIN_DRIFT_REQUIRED makes a missing clone a failure here, so
  # this job cannot pass by not finding what it checked out.
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: alexander-shamray/blueprint-backend
          path: .drift/blueprint-backend
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet test tests/Admin.Host.Tests --filter "FullyQualifiedName~Admin.Host.Tests.Drift"
        env:
          BLUEPRINT_Admin__BackendDir: ${{ github.workspace }}/.drift/blueprint-backend
          ADMIN_DRIFT_REQUIRED: 'true'

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Admin.Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/Admin.Web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/Admin.Web/package-lock.json
      - run: dotnet build
      - run: npm ci
        working-directory: src/Admin.Web
      - run: npm run build
        working-directory: src/Admin.Web
      - run: npx playwright install --with-deps chromium
        working-directory: src/Admin.Web
      - run: npm run e2e
        working-directory: src/Admin.Web
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: src/Admin.Web/playwright-report/

  # The harness's own suite. Python 3.12 matches the PreToolUse hooks.
  # The matrix is the module's own claim: link resolution, case folding and
  # which primitives exist differ by platform.
  harness:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: runner.os == 'Windows'
        run: choco install jq --no-progress -y
      - if: runner.os == 'macOS'
        run: brew install jq
      - name: The suite reads `git ls-files`, so the checkout must be a real one
        run: git rev-parse --is-inside-work-tree
      # Both roots, as parallel class shards: the serial run cost 440 s on
      # this matrix's Windows leg against 107 s on ubuntu. The runner owns
      # which roots those are, so this job and harness-checks.sh cannot come
      # to run different suites. It also reaches .github/locality-gate, whose
      # own workflow is a different subject — the base copy of the gate judged
      # against the PR body — rather than a duplicate of this.
      - run: python .claude/scripts/shard-harness-suite.py
