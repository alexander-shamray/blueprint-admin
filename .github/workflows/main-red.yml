name: main red

# A pull request is not tested against the `main` it lands on, so two that are
# green apart can be red together, and only `ci`'s run on the push to `main`
# sees it. That run's failure mails whoever merged, if their settings say so;
# this makes it an issue instead, which every session lists. One issue is open
# at a time: a later failure comments on it, and the next green run closes it.
# What a red `main` is owed is docs/working-rules.md, *Merging beside other
# agents*. Nothing is checked out and nothing from the run is executed, so the
# write token never meets the code that failed.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  issues: write

jobs:
  alert:
    if: github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Open, comment on or close the red-main issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          TITLE: main is red
        run: |
          set -euo pipefail
          open=$(gh issue list --state open --label bug --search "in:title \"$TITLE\"" --json number,title \
            --jq 'map(select(.title == env.TITLE)) | .[0].number // empty')
          case "$CONCLUSION" in
            failure|timed_out)
              body="\`ci\` ended \`$CONCLUSION\` on \`main\` at $HEAD_SHA: $RUN_URL"
              if [ -n "$open" ]; then
                gh issue comment "$open" --body "$body"
              else
                gh issue create --title "$TITLE" --label bug --label high --body "$body

          Found by \`.github/workflows/main-red.yml\`, which watches \`ci\` on every push to \`main\`. Revert the pull request that turned it red first (\`bash .claude/scripts/git-revert-pr.sh <n>\`), then fix forward; a flake goes on the flaky tracker instead. The next green run on \`main\` closes this issue."
              fi
              ;;
            success)
              if [ -n "$open" ]; then
                gh issue close "$open" --comment "\`ci\` is green on \`main\` again at $HEAD_SHA: $RUN_URL"
              fi
              ;;
          esac
