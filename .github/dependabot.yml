# Weekly version updates for the three ecosystems this repository pins.
# Security updates are a repository setting, not configured here.
# docs/change-locality.md section 6 says why the two gates skip a Dependabot
# pull request.
version: 2

# The assistant's core and adapter restore from blueprint-backend's packages on
# GitHub Packages (nuget.config's blueprint-backend source), which asks for a
# token even for a public package. Dependabot runs outside the workflows, so
# the job token ci.yml hands the restore never reaches it, and GitHub Packages
# takes only a personal access token here. PACKAGES_READ_TOKEN is a Dependabot
# secret holding a classic token with read:packages and nothing else.
registries:
  blueprint-backend:
    type: nuget-feed
    url: https://nuget.pkg.github.com/alexander-shamray/index.json
    token: ${{secrets.PACKAGES_READ_TOKEN}}

updates:
  - package-ecosystem: npm
    directory: /src/Admin.Web
    schedule:
      interval: weekly
    groups:
      angular:
        applies-to: version-updates
        patterns:
          - '@angular/*'
          - '@angular-devkit/*'

  # Directory.Packages.props is the central pin file; Dependabot reads it from
  # the root.
  - package-ecosystem: nuget
    directory: /
    registries:
      - blueprint-backend
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
