# Weekly version updates for the three ecosystems this repository pins.
# Security updates are a repository setting, not configured here.
# docs/change-locality.md section 6 says why the two gates skip a Dependabot
# pull request.
version: 2
updates:
  - package-ecosystem: npm
    directory: /src/Admin.Web
    schedule:
      interval: weekly
    groups:
      angular:
        applies-to: version-updates
        patterns:
          - '@angular/*'
          - '@angular-devkit/*'

  # Directory.Packages.props is the central pin file; Dependabot reads it from
  # the root.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
